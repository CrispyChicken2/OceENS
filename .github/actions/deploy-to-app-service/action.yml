# One deploy, whichever the environment: write the environment's settings to
# its App Service app, set the app to the given image, then wait until that
# image answers. The caller is already logged in to Azure, as the GitHub
# Environment it runs in.
name: Deploy to App Service
description: Run one image on one environment's App Service app, with that environment's settings.

inputs:
  image:
    description: The image to run, tagged with the commit it was built from.
    required: true
  resource-group:
    description: The resource group holding the app.
    required: true
  app-name:
    description: The environment's App Service app.
    required: true
  dev-login-key:
    description: The environment's own DEV_LOGIN_KEY.
    required: true
  secret-key:
    description: The environment's own SECRET_KEY, which signs the session cookie.
    required: true
  mistral-api-key:
    description: MISTRAL_API_KEY, the key the default LLM provider reads.
    required: true
  default-provider-base-url:
    description: DEFAULT_PROVIDER_BASE_URL, where the default LLM provider is called.
    required: true

runs:
  using: composite
  steps:
    # An empty secret would deploy an open sign-in, or a session key that
    # changes at every start. Refuse before anything is written. Only the
    # names are printed, never a value.
    - name: Refuse to deploy with a missing setting
      shell: bash
      env:
        AZURE_RESOURCE_GROUP: ${{ inputs.resource-group }}
        AZURE_WEBAPP_NAME: ${{ inputs.app-name }}
        DEV_LOGIN_KEY: ${{ inputs.dev-login-key }}
        SECRET_KEY: ${{ inputs.secret-key }}
        MISTRAL_API_KEY: ${{ inputs.mistral-api-key }}
        DEFAULT_PROVIDER_BASE_URL: ${{ inputs.default-provider-base-url }}
      run: |
        missing=0
        for name in AZURE_RESOURCE_GROUP AZURE_WEBAPP_NAME DEV_LOGIN_KEY SECRET_KEY MISTRAL_API_KEY DEFAULT_PROVIDER_BASE_URL; do
          if [ -z "${!name}" ]; then
            echo "$name is not set in this GitHub Environment" >&2
            missing=1
          fi
        done
        exit "$missing"

    # Written at every deploy, so that the GitHub Environment stays the one
    # place a setting is changed. --output none: the command would otherwise
    # print every setting back, secrets included.
    #
    # - WEBSITES_PORT: uvicorn listens on 8000, not on the 80 App Service expects.
    # - WEBSITES_ENABLE_APP_SERVICE_STORAGE=false: the SQLite file stays on the
    #   container's own disk, in /app/database, and not on /home, a network
    #   share. Each start creates and seeds the database again (README,
    #   "Deploying on Azure App Service").
    # - AUTH_MODE=dev: a fork never signs in through Microsoft. The dev sign-in
    #   is guarded by the environment's own DEV_LOGIN_KEY.
    # - RUN_SUMMARIES_DAEMON=1: the image starts one process, the web server.
    #   With this, it starts the summaries daemon too, the second process
    #   launch.sh started.
    # - DEFAULT_PROVIDER_*: the LLM row the seed writes on the new database.
    #   DEFAULT_PROVIDER_KEY_ENV is the name of the key's setting, not its value.
    - name: Write this environment's settings
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
        DEV_LOGIN_KEY: ${{ inputs.dev-login-key }}
        SECRET_KEY: ${{ inputs.secret-key }}
        MISTRAL_API_KEY: ${{ inputs.mistral-api-key }}
        DEFAULT_PROVIDER_BASE_URL: ${{ inputs.default-provider-base-url }}
      run: |
        az webapp config appsettings set \
          --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
          --settings \
            WEBSITES_PORT=8000 \
            WEBSITES_ENABLE_APP_SERVICE_STORAGE=false \
            AUTH_MODE=dev \
            RUN_SUMMARIES_DAEMON=1 \
            "DEV_LOGIN_KEY=$DEV_LOGIN_KEY" \
            "SECRET_KEY=$SECRET_KEY" \
            "MISTRAL_API_KEY=$MISTRAL_API_KEY" \
            DEFAULT_PROVIDER_API_TYPE=openai \
            "DEFAULT_PROVIDER_BASE_URL=$DEFAULT_PROVIDER_BASE_URL" \
            DEFAULT_PROVIDER_MODEL=ministral-14b-latest \
            DEFAULT_PROVIDER_KEY_ENV=MISTRAL_API_KEY

    # The image is public on GHCR, so the app pulls it without credentials.
    - name: Set the app to the image
      shell: bash
      env:
        RESOURCE_GROUP: ${{ inputs.resource-group }}
        APP_NAME: ${{ inputs.app-name }}
        IMAGE: ${{ inputs.image }}
      run: |
        az webapp config container set \
          --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --output none \
          --container-image-name "$IMAGE"
        set_to=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$APP_NAME" --query linuxFxVersion --output tsv)
        if [ "$set_to" != "DOCKER|$IMAGE" ]; then
          echo "$APP_NAME is set to $set_to, not $IMAGE" >&2
          exit 1
        fi
        echo "$APP_NAME is set to $IMAGE"

    # App Service keeps serving the previous container until the new one has
    # started, so a 200 alone may come from the old version. The image holds
    # its commit and the application sends it back in X-Revision: wait for a
    # 200 that carries the commit just deployed. /dev/login reads the database,
    # so it answers 200 only once the tables are created and seeded. A
    # container that never starts fails this job, even while the old one still
    # answers.
    #
    # The limit is the one the Worked Example measured on the same B1 tier:
    # 700 s, twice its slowest start. Most of the wait is the pull of the image.
    - name: Wait until the new version answers
      shell: bash
      env:
        APP_NAME: ${{ inputs.app-name }}
        IMAGE: ${{ inputs.image }}
      run: |
        url="https://$APP_NAME.azurewebsites.net/dev/login"
        revision="${IMAGE##*:}"
        limit=700
        start=$(date +%s)
        attempt=0
        while true; do
          attempt=$((attempt + 1))
          answer=$(curl -s -o /dev/null -w '%{http_code} %header{x-revision}' --max-time 30 "$url" || true)
          elapsed=$(( $(date +%s) - start ))
          if [ "$answer" = "200 $revision" ]; then
            echo "$url answers 200 from $revision, $elapsed s after the image was set"
            exit 0
          fi
          echo "Attempt $attempt, $elapsed s: $url answered ${answer:-nothing}, waiting for 200 $revision"
          if [ "$elapsed" -ge "$limit" ]; then
            echo "$url did not answer 200 from $revision within $limit s" >&2
            exit 1
          fi
          sleep 15
        done
